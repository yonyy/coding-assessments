<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dropbox — Shared Links</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="topbar">
    <span class="topbar__logo">Dropbox</span>
    <span class="topbar__subtitle">Shared Links</span>
  </header>

  <main class="container">

    <!-- Create link form -->
    <section class="card form-card">
      <h2 class="section-title">Create a shared link</h2>
      <form id="create-form" novalidate>

        <div class="field">
          <label for="file-select">File</label>
          <!-- TODO: populate from availableFiles (fetch from /api/links initially,
               or hardcode the 5 file options to match the server's availableFiles) -->
          <select id="file-select" required>
            <option value="">— Select a file —</option>
            <option value="file-001">Q4 Budget.xlsx</option>
            <option value="file-002">Product Roadmap.pdf</option>
            <option value="file-003">Team Photo.jpg</option>
            <option value="file-004">Architecture Diagram.png</option>
            <option value="file-005">Onboarding Guide.pdf</option>
          </select>
        </div>

        <div class="field">
          <label for="label-input">Label <span class="optional">(optional)</span></label>
          <input type="text" id="label-input" placeholder="e.g. For Alice" maxlength="80" />
        </div>

        <div class="field">
          <label for="ttl-select">Expires</label>
          <!-- TODO: when Custom is selected, show the custom-seconds input -->
          <select id="ttl-select">
            <option value="">Never</option>
            <option value="3600">1 hour</option>
            <option value="86400">24 hours</option>
            <option value="604800">7 days</option>
            <option value="custom">Custom…</option>
          </select>
        </div>

        <div class="field" id="custom-ttl-field" hidden>
          <label for="custom-seconds">Custom TTL (seconds)</label>
          <input type="number" id="custom-seconds" min="1" placeholder="e.g. 300" />
        </div>

        <div id="form-error" class="form-error" hidden></div>

        <button type="submit" class="btn-primary" id="submit-btn">Create link</button>
      </form>
    </section>

    <!-- Link list -->
    <section>
      <h2 class="section-title">Your shared links</h2>

      <div id="links-loading" class="loading-state" hidden>
        <div class="skeleton-row"></div>
        <div class="skeleton-row"></div>
      </div>

      <div id="links-empty" class="empty-state" hidden>
        <p>No shared links yet. Create one above.</p>
      </div>

      <!-- TODO: render a .link-card for each link:
             - Status badge (.badge--active / .badge--expired / .badge--revoked)
             - File name and label
             - Share URL with a "Copy" button (uses Clipboard API)
             - Created at, expires at (or "Never")
             - "Revoke" button (only for active links) -->
      <div id="link-list" class="link-list"></div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
